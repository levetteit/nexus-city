<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Starnet City</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" content="#1b0f6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Starnet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // iOS home-screen apps (black-translucent status bar) can hand the page a viewport that stops
    // short of the bottom of the screen. Measure the gap and let the CSS stretch into it.
    (function () {
      var standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      function fit() {
        var ext = 0;
        if (standalone && screen && screen.height) {
          var land = innerWidth > innerHeight;
          var full = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
          var gap = full - innerHeight;
          if (gap > 0 && gap < 140) ext = gap;
        }
        var r = document.documentElement.style;
        r.setProperty("--ext", ext + "px");
        r.setProperty("--hb", ext ? "22px" : "0px");   // keep clear of the home bar once we reach it
      }
      fit();
      addEventListener("resize", fit);
      addEventListener("orientationchange", function () { setTimeout(fit, 300); });
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <header id="hud">
    <div class="brand">STARNET<span>CITY</span></div>
    <div id="tickers"></div>
    <div id="clock">--:--</div>
  </header>

  <div id="conn" class="hidden">reconnecting to the city…</div>

  <section id="account" class="panel">
    <div class="acct-head" id="acct-toggle"><span id="acct-firm">PROP ACCOUNT</span><span id="acct-phase" class="phase">—</span></div>
    <div id="acct-sum"></div>
    <div id="acct-body"></div>
  </section>

  <section id="feed" class="panel">
    <h3>ACTIVITY</h3>
    <ul id="feed-list"><li class="muted">waiting for the bots…</li></ul>
  </section>

  <section id="payroll" class="panel hidden">
    <button class="close" data-close="payroll">×</button>
    <h3>PAYROLL · TODAY</h3>
    <table>
      <thead><tr><th>Worker</th><th>Trades</th><th>Wins</th><th>Earned</th></tr></thead>
      <tbody id="payroll-rows"></tbody>
    </table>
    <p class="note">Every closed trade sends its money down the road to the vault: gold coins in, red coins out.</p>
  </section>

  <section id="room" class="hidden">
    <div id="room-view"></div>
    <div class="room-top">
      <div id="room-title"></div>
      <button id="room-chart">CHART</button>
      <button id="room-stats">STATS</button>
      <button id="room-close">✕</button>
    </div>
    <div id="room-bubble" class="hidden"></div>
    <div class="room-hint">drag to look around</div>
  </section>

  <section id="chart" class="hidden">
    <div class="chart-top">
      <div class="chart-name"></div>
      <div class="tfs"><button data-tf="1" class="on">1m</button><button data-tf="3">3m</button><button data-tf="6">6m</button><button data-tf="15">15m</button></div>
      <button id="chart-close">✕</button>
    </div>
    <canvas></canvas>
    <div class="chart-info"></div>
  </section>

  <section id="reports" class="panel hidden">
    <button class="close" data-close="reports">×</button>
    <h3>DAILY REPORTS</h3>
    <div id="reports-body"></div>
  </section>

  <section id="worker" class="panel hidden">
    <button class="close" data-close="worker">×</button>
    <div id="worker-body"></div>
  </section>

  <script type="module" src="city.js"></script>
</body>
</html>
